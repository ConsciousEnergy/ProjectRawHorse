name: CI

on:
  push:
    branches: [main, 'PRH_v*']
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Syntax check all Python files
        run: python -m py_compile backend/main.py && python -c "
          import ast, glob
          files = glob.glob('backend/**/*.py', recursive=True)
          for f in files:
              ast.parse(open(f, encoding='utf-8').read())
          print(f'All {len(files)} Python files parse OK')
          "

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
